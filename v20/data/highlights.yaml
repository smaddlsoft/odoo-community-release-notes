# Editorial pick of Community highlights (ids from odoo-20.0.yaml). "why" is our own wording.
# A screenshot at img/<id with "/" replaced by "__">.png is embedded automatically; "caption" says what it shows.
- id: general/offline-mode
  why: records can be created/edited/archived while offline, and past searches replayed — in the CE web client.
  caption: Offline mode on a German user interface — the orange “Offline arbeiten” (working offline) indicator in the top bar while the record
    stays open; its tooltip lists the changes still waiting to be sent.
- id: general/simplified-access-rights
  why: ir.model.access and ir.rule merge into one ir.access model (group, operation, domain) and security/ir.access.csv; affects every module
    that ships security files.
  caption: Access right form in developer mode — one record holds model, group, the Create/Read/Update/Delete operations and a domain.
- id: general/activities
  why: activities can be assigned to a role (a team) instead of one person, in the redesigned dialogs.
  caption: 'Schedule Activity dialog in the new dialog design — the new “Role” field assigns the activity to a team (here: Accounting Team).'
- id: contacts/hierarchical-view
  why: a hierarchy view shows companies with their contacts and sub-companies as a tree.
  caption: Contacts — the new hierarchy view button next to the list, Kanban and activity views.
- id: general/tax-included-excluded-on-orders-and-invoices
  why: switch tax-included/excluded prices per sales order, purchase order and invoice.
  caption: Sales order form — the new “Tax Excl.” switch above the order lines toggles between tax-excluded and tax-included prices.
- id: general/multiple-partner-identifiers
  why: typed, validated partner identifiers (DUNS, national IDs) on the contact form.
  caption: Contact form on a German user interface — the “+” next to the tax ID (TIN) offers further identifier types, here DUNS and company ID
    (Unternehmens-ID).
- id: general/translation
  why: an in-context translation mode (module “Translation Mode”) shows every text on the screen with its translation and links to Weblate; translatable
    fields can also be imported/exported via CSV/Excel.
  caption: Translation Mode on a German user interface — the side panel lists the texts of the screen (English source, German translation); the
    highlighted entry is the app title marked on the left, and “Translate” opens the term in Odoo’s Weblate project.
- id: general/multi-record-drag-and-drop
  why: reorder or move several records at once in list and Kanban views.
  caption: CRM pipeline on a German user interface — two selected opportunities (“2 ausgewählt”) dragged together to another stage; the placeholder
    reads “Move 2 records”. Select cards with Alt+click (Shift+click for a range).
- id: general/pin-messages-in-the-chatter
  why: pin, filter and CC in the chatter; activities can be assigned to roles.
  caption: Chatter — the new filter (All / Messages / Notes / Activities / Changes) and the pinned-messages button (pin icon).
- id: discuss/polls
  why: run quick polls inside any Discuss conversation, with emoji options, single or multiple answers and a time limit.
  caption: 'Discuss on a German user interface — the new “Create Poll” dialog: question, options (with emoji), “allow multiple options” and a
    duration.'
- id: calendar/multiple-calendars-in-one-place
  why: several calendars per user, shared team calendars, colleagues' calendars and pending activities in one view.
  caption: Calendar — “+ Add a calendar” in the side panel for extra or shared calendars, and pending activities in the all-day row.
- id: crm/lead-distribution
  why: 'per salesperson, choose how automatic lead assignment treats them: always in rotation, in rotation with a limit, or out of rotation.'
  caption: 'CRM → Configuration → Sales Teams → team member — the new “Auto-Assignment Rules”: Always in rotation, In rotation with a limit, Out
    of rotation.'
- id: accounting/parent-accounts
  why: parent accounts replace account groups and account codes become optional — structural change for charts of accounts and reporting modules.
  caption: Chart of accounts — the new “Parent Account” column (optional, shown via the column selector). The panel on the left is the existing
    grouping by code prefix, not the parent accounts.
- id: accounting/intuitive-payment-status
  why: payment states renamed (In Process → Paid → Reconciled); check custom reports and filters.
  caption: 'Customer payments — the status column uses the renamed statuses: matched payments show “Reconciled” (formerly “Paid”); payments not
    yet matched show “Paid” (formerly “In Process”).'
- id: accounting/employee-expenses-menu-item
  why: 'the separate Employee Expenses menu is gone: approved expenses become draft vendor bills and are handled with the other bills.'
  caption: Invoicing dashboard — approved expenses show up with the vendor bills in the Purchases card (“1 Expense”).
- id: accounting/withholding-tax-on-payment-improvements
  why: amount due / withhold due / net due split, and pay-only-withholding option in the payment wizard.
- id: sales/dashboard
  why: key figures and quick filters (to confirm, to deliver, to invoice, revenue) on top of the quotations list.
  caption: Quotations list — the new dashboard strip with To Confirm / To Deliver / To Invoice filters and revenue for the chosen period.
- id: sales/product-images
  why: product images on sales order lines and in the quotation/order PDF.
  caption: 'Sales order PDF — the product image is printed next to the order line (here: Screw Driver).'
- id: sales/description-only-sales-order-lines
  why: sales order lines no longer need a product (optional "Mandatory Product" setting).
  caption: New quotation on a German user interface — an order line with only a description (“Auftragszeile ohne Produkt…”) and no product; above
    it the tax excluded/included switch (“exkl. Steuern / inkl. Steuern”).
- id: manufacturing/manufacturing-order-kanban-view
  why: MO Kanban grouped by week with component availability, deadlines and remaining time.
  caption: Manufacturing orders Kanban — grouped by week with a workload bar, component availability and remaining time per order.
- id: manufacturing/continuous-production
  why: record produced quantities per work order and start the next operations early; MOs can also be split and reset to draft.
- id: inventory/product-replenishment
  why: one "Order" button, snooze and automate in the replenishment view; min/max suggestions from demand history.
  caption: Replenishment — a single “Order” button per line, next to “Automate” and “Snooze”.
- id: point-of-sale/multiple-currencies
  why: cash and bank payment methods accept several currencies (new “Currencies” field on the payment method); also service fees, snoozed products,
    simplified receipts and printer selection.
  caption: Point of Sale → Configuration → Payment Methods → Cash — the new “Currencies” field (here EUR and USD).
- id: online-payments/pay-on-invoice-provider
  why: confirm orders without immediate payment; new Toss Payments provider, more Stripe/Mollie methods, wire transfers auto-confirmed from bank
    transactions.
  caption: Payment providers — the new “Pay on Invoice” provider (top left) and the new Toss Payments provider (bottom right).
- id: website/llms-txt
  why: llms.txt, structured data by default, GTM field, banners, age verification and a reworked website builder.
  caption: Website settings, Tracking & SEO — the new llms.txt setting with “Edit llms.txt”.
- id: website/age-verification-popup
  why: a ready-made popup asks visitors to confirm their age and blocks access if they don't.
  caption: Website editor — the age verification popup (“Are you 18 years or older?”), listed under Invisible Elements.
- id: technical/mail-in-body-tracking
  why: tracking values are no longer stored — tracking messages are generated on the fly; affects modules that read mail.tracking.value.
