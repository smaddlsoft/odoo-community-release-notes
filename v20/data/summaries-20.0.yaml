# Short item summaries in our own words (not Odoo's text). Keyed by item id of odoo-20.0.yaml.
general/activities: Activities can be assigned to a role instead of a person; the Schedule Activity dialog and chatter got UX improvements, and
  meeting activities show more context.
general/calendar-view-side-panel: In calendar views with scheduling enabled, drag records into the side panel to unschedule them.
general/cc-email-recipients: Add CC recipients when sending emails; the chatter shows who was in CC.
general/chatter-filter: Filter the chatter to show only messages or only tracked changes.
general/currency-aggregates-date: When totals are converted to another currency, the date of the exchange rate used is shown.
general/decimal-separator: Both dot and comma are accepted as decimal separator when typing numbers, whatever the user's language.
general/dialog-design: Redesigned dialogs.
general/digest-email-kpis: More KPIs available in the periodic digest emails.
general/download-attachments-in-bulk: Download many attachments at once from the Technical menu, across models and records.
general/email-template-preview: Better email template preview, with navigation between sample records.
general/favorited-searches: Saved favourite searches in list views remember the visible columns.
general/file-sharing-on-mobiles: Share files from a phone to Odoo (e.g. a bill, expense receipt) to create records such as bills, expenses, tasks,
  leads, to-dos or time off.
general/gantt-view: Select a whole row/column in Gantt views, start/end buffers, and schedule/unschedule via a side panel (Studio option).
general/import-product-variants: Import products with one line per variant, including attribute values, cost and on-hand quantity.
general/incremental-edits-on-duration-fields: Type +=, -=, *= or /= in duration fields to adjust the current value (e.g. +=2 adds two hours).
general/label-design: Redesigned product, manufacturing and packaging labels.
general/link-previews: Links to an Odoo website shared on social platforms show a preview card.
general/link-to-current-search: Share a link to the current view that keeps filters, search and grouping.
general/list-view-expand-collapse-groups: Alt+click expands or collapses all groups of the same level in list views.
general/mail-plugins: 'Gmail/Outlook plugins: search contacts, tasks or helpdesk tickets and log emails on them; pick recipients in multi-person
  threads.'
general/map-view-unlocated-records: Map view shows records without an address so they can be opened and fixed.
general/material-symbols: Icons switch from Font Awesome to Google Material Symbols.
general/mobile: 'Mobile: swipe down on the home screen for the command palette, date picker in a bottom sheet, better touch forms, new secure
  login screen.'
general/multi-record-drag-and-drop: Drag and drop several selected records at once in list and Kanban views.
general/multiple-partner-identifiers: Store several typed, validated identifiers per partner (e.g. DUNS or national IDs).
general/my-subscription-page: New 'My Subscription' page in the user menu with plan, IAP services and database management.
general/offline-mode: Create, edit, archive and delete records while offline, and re-run earlier searches.
general/partner-autocomplete: Partner autocomplete no longer turns industry data into partner tags; it stays in the chatter.
general/pin-messages-in-the-chatter: Pin important messages in the chatter.
general/portal-layout: Portal users can reorder the cards on their portal home.
general/record-deletion: When a record cannot be deleted, Odoo offers to archive it instead.
general/relative-range-tooltip: Relative date filters (e.g. 'Last 30 days') show the actual dates in a tooltip.
general/rich-text-editor: Simplified media toolbar in the rich-text editor.
general/product-catalog-units-of-measure: Choose the unit or packaging when adding products from the catalog.
general/sendcloud-shipping-labels: Choose PDF, ZPL or PNG for Sendcloud shipping labels.
general/simplified-access-rights: 'Access rights and record rules are unified: an access right can carry a domain that limits which records it
  applies to.'
general/tablets-bottom-sheets: Bottom sheets (panels sliding up from the bottom) also on tablets in touch mode.
general/tax-included-excluded-on-orders-and-invoices: Switch between tax-included and tax-excluded prices on sales orders, purchase orders and
  invoices; taxes can override the setting.
general/text-messages: Schedule text messages and use dynamic placeholders in SMS templates.
general/translation: Optional in-context 'Translation Mode' (via command palette) to translate modules with Weblate; import/export of translatable
  fields in several languages via CSV/Excel.
general/translation-wizard: New wizard to translate text and HTML fields.
technical/mail-in-body-tracking: Tracking values are no longer stored; tracking messages are built on the fly. A separate module keeps stored
  tracking values for those who need them.
technical/many-to-one-field-improvements: Many2one fields sync with the server and handle adding/removing values better, also with large lists.
technical/push-notifications: Push notifications no longer go through Firebase but through Odoo's own push service.
technical/track-source-of-postings: Outgoing mail records record where their content came from, for auditing.
technical/tracking-user-group-changes: Changes to a user's groups are logged in the user's chatter and in the server log.
industries/accounting-firm: 'Accounting Firm package: identity documents, anti-money-laundering, and a Databases dashboard to manage client databases.'
industries/agri-equipment-rental: New package for renting and maintaining agricultural machinery.
industries/beauty-parlor: 'New package for beauty parlors: customers, appointments, treatment follow-up, invoicing.'
industries/catering: New package for caterers, from first contact to on-site planning.
industries/community-care: 'New package for community care organisations: staff planning and holidays, residents and their data, knowledge transfer.'
industries/construction-builder: Construction Builder renamed General Contractor; quotes built from reusable section templates.
industries/construction-developer: Construction Developer renamed Property Developer and rebuilt on standard Manufacturing and Inventory (BoMs,
  MOs, routings, locations).
industries/custom-industrial-equipment: New engineer-to-order package for EPC and turnkey projects, from design to manufacturing, procurement
  and installation.
industries/deposit-module: The Deposit Management module (from Beverage Distributor / Micro-Brewery) can be installed on its own.
industries/electronic-refurbishment: New package for refurbishing electronics, with refurbishment grades and VAT margin scheme.
industries/excise-module: Excise module separates production from inventory adjustments in the excise report.
industries/hospitality-industries: 'Hotel, Holiday House, Guest House and Campsite packages: housekeeping, bar/restaurant charges on the final
  bill, seasonal pricing.'
industries/hotel: 'Hotel package: guest count, multiple companies and branches.'
industries/interior-design: 'New package for interior designers: website inquiries, resource planning, purchasing, projects and profitability.'
industries/machine-and-tool-rental: 'New package for machine and tool rental: contracts, quarantine on return, consumption-based down payments,
  run-time monitoring, maintenance.'
industries/mental-therapy: 'New package for mental health professionals: patients, sessions, notes, invoicing.'
industries/nonprofit-organization: 'Nonprofit package: better donation receipts; petitions removed.'
industries/pet-groomer: New package for pet groomers.
industries/physical-therapy: 'New package for physical therapists: patients, sessions, treatment tracking, billing.'
industries/property-management: Property Owner Association and Real Estate packages can be combined with Property Management in one database.
industries/property-owner-association: 'Property Owner Association package: owner history, general meetings, cost distribution based on meter
  readings.'
industries/public-institution: 'New package for public institutions: citizen support, appointments, portal, facility rental, events.'
industries/real-estate: 'Real Estate package: editable matchmaking criteria; combinable with Property Management.'
industries/talent-acquisition: 'Talent Acquisition package: better link between applicants, talent pool and job positions.'
industries/vineyard: New package for vineyards, from grape to wine.
accounting/accounting-firms-mode-settings: More flexible 'Accounting Firms mode' settings.
accounting/analytic-distribution-for-write-offs: Set an analytic distribution on write-offs during reconciliation.
accounting/annual-report-layout: Annual reports use the company's document layout.
accounting/asset-depreciation: Depreciation accepts rates and decimal numbers.
accounting/bank-consistency: Journal entries on bank accounts must come from bank transactions; clearer feedback on statement balance inconsistencies.
accounting/bank-reconciliation-summary-report: New bank reconciliation summary report (reconciled vs unreconciled at period end).
accounting/bank-synchronization-syncfy: Syncfy added as bank synchronization provider for Latin America.
accounting/bill-line-prediction: When encoding a bill, product, account, taxes, analytics and vehicle are suggested from bill history and the
  label.
accounting/bill-options-display: Bill line options (depreciation model, vehicle, deferral) are stacked under the account.
accounting/bill-invoice-matching-rules: '''Matching Rules'' define payment tolerance and matching order for automatic bill/invoice reconciliation.'
accounting/cash-journal-entry-hashing: Cash journals can be secured with entry hashing on reconciliation.
accounting/conversion-rates: Conversion rates are shown when registering foreign-currency payments.
accounting/cumulative-translation-adjustment-cta: Auditable Cumulative Translation Adjustment (CTA) line in balance sheet, trial balance and general
  ledger.
accounting/currency-exchange-rate-providers: 'New automatic currency rate providers: Azerbaijan, Georgia, Kazakhstan, Saudi Arabia, Uzbekistan.'
accounting/customer-invoice-reminders: Send invoice reminders manually from the invoice list or form; automatic reminders configurable in settings.
accounting/download-invoice-attachments: Download a zip with all generated attachments (PDF, XML…) of selected invoices.
accounting/employee-expenses-menu-item: 'The separate ''Employee Expenses'' menu is gone: approved expenses create draft bills in the expense
  journal.'
accounting/exchange-entries: Exchange differences are grouped into one line per invoice, with expandable details.
accounting/improved-duplicate-detection: 'Two-level duplicate warnings on invoices and bills (red: likely duplicate, yellow: check).'
accounting/intercompany-purchase-order-matching: Synchronised inter-company vendor bills are matched with the synchronised purchase orders.
accounting/intuitive-payment-status: Payment statuses renamed ('In Process' → 'Paid', 'Paid' → 'Reconciled'); 'Mark as Reconciled' moved to the
  action menu.
accounting/inventory-valuation: Accrual entries (bills to receive, billed not received, etc.) can be created from the inventory valuation closing
  report.
accounting/invoice-email-attachments: Add files from Documents or earlier chatter attachments when emailing an invoice.
accounting/manual-reconciliation: Manual reconciliation on any account; 'Allow Reconciliation' renamed 'Payment Reconciliation'.
accounting/multi-ledger-consolidation: Multi-ledger consolidation now includes (rather than excludes) journals.
accounting/multiple-invoice-details: When sending several invoices at once, the dialog shows how each will be sent.
accounting/new-currency-caribbean-guilder: Caribbean Guilder (XCG) added and set as default currency for Curaçao and Sint Maarten.
accounting/onboarding-improvements: Easier accounting onboarding for e-invoicing and tax setup.
accounting/optimized-data-entry: Faster bank statement encoding with reconciliation-model shortcuts and transaction batching.
accounting/pain-version-setting: The PAIN (ISO 20022) version is set per payment method instead of per journal.
accounting/parent-accounts: Parent accounts replace account groups to structure the chart of accounts; account codes become optional.
accounting/pay-bills-from-odoo: Pay bills (single or batch) from Odoo with one signature via payment initiation (PISP).
accounting/peppol-global-location-identifiers: Add GLN location identifiers to delivery contacts for Peppol.
accounting/prevent-double-payments-in-the-payment-wizard: The payment wizard deducts pending payments to avoid paying twice, and sorts outstanding
  payments by date.
accounting/professional-percentage-for-receipts: The 'Professional' percentage column also exists on purchase receipts.
accounting/purchase-order-matching: 'Better bill-to-PO matching: auto-complete checks existing lines first, shows a summary, warns on price/quantity
  differences, and allows unmatching.'
accounting/reconciliation-with-multiple-accounts: Split a bank transaction across several accounts more easily in reconciliation.
accounting/reminder-workflow: Simpler workflow for automatic and manual payment reminders.
accounting/reset-to-draft-action-in-list-views: '''Reset to Draft'' as a batch action in any journal entry list.'
accounting/run-auto-reconciliation: Re-run automatic bank reconciliation on demand.
accounting/simplification-of-asset-models: Asset models become depreciation models; asset settings live on the asset accounts.
accounting/split-items-on-invoices: Split selected journal items of an invoice, e.g. across quantities, assets or accounts.
accounting/taxes-in-fiscal-positions: Taxes outside the fiscal position of an invoice are dropped, even without a replacement tax.
accounting/valuation-without-inventory: Track stock on hand and valuation without installing Inventory.
accounting/withholding-tax-on-payment-improvements: Bills with withholding tax show amount due, withholding due and net due; the payment wizard
  can pay either part or both.
localizations/argentina: 'Accounting: VAT book PDF without headers/footers for official ledger books, ARCA daily currency rates, ''Payment on
  Informed CBU'' legend, SICORE export, better third-party check handling, withholdings in foreign currency, daily book export to Excel. Inventory:
  batch processing and manual vendor numbers for Remitos.'
localizations/armenia: 'Accounting: ISO 3166-2 state names and codes.'
localizations/australia: 'Accounting: open-banking bank synchronization through Basiq.'
localizations/azerbaijan: 'Accounting: ISO 3166-2 state names and codes.'
localizations/bahrain: 'Accounting: state codes updated to ISO 3166-2.'
localizations/bangladesh: 'Accounting: old tax report removed, 2026 Finance Act rates, tax groups by nature (VAT, TDS, VDS), chart of accounts
  with parent accounts.'
localizations/belgium: 'Payroll: automated Dimona, joint committees, merged ''Regular Pay'' structure, directors'' pay, meal-voucher reporting,
  flexi-jobs, holiday pay, earning caps, CP302 year-end bonus, profit-sharing bonus.'
localizations/brazil: 'Accounting: NF-e/NFS-e for exports, OCR import of NFS-e, batch XML download, more fiscal fields on operation types, Avalara
  options, alphanumeric CNPJ, streamlined fiscal workflow. Inventory: more fiscal fields, NF-e data on shipping labels. POS: cancel NFC-e.'
localizations/canada: 'Accounting: detailed expense accounts, localized asset models, batch customer payments via CPA 005 pre-authorized debit
  files.'
localizations/chile: 'Accounting: expense accounts and asset models, XML import of customer invoices, commune data, non-billable amounts, CAF
  sharing across branches, F29 report on tax tags. Inventory: delivery-guide copies per SII layout.'
localizations/china: 'Accounting: improved chart of accounts and statements, asset models, parent accounts, voucher batch printing, VAT & surcharges
  return, VAT differential taxation on invoice lines.'
localizations/colombia: 'Accounting: expense accounts and asset models, e-invoicing of free samples, better fiscal PDFs, DIAN-only connection
  (Carvajal dropped), contingency invoicing, CUFE-based duplicate detection, exogenous reports, mandate invoices for goods, discounts in XML,
  ZIP import of vendor bills.'
localizations/dominican-republic: 'Accounting: e-invoicing (e-CF 31–34) via Infile to DGII, 606 purchase report as TXT, updated IT-1 report, cédula
  next to RNC for eCommerce e-invoicing.'
localizations/ecuador: 'Accounting: custom legend on e-document PDFs, cleaner chart of accounts, better invoice layout, new withholding taxes,
  provider RUC on documents. POS: blocks ''Consumidor Final'' sales above the legal limit.'
localizations/egypt: 'Accounting: ETA sync in the Send wizard with demo mode and batch PDF fetch, 6-digit chart with parent accounts, updated
  VAT/withholding reports, gross-up withholding, ETA unit codes, state changes. Payroll: calendar-day schedules, overtime, NOSI/ETA forms. POS:
  e-receipts to ETA.'
localizations/france: 'Accounting: PCG-compliant annual report templates (plaquettes); automatic detection of e-invoicing directory endpoints
  from the SIREN.'
localizations/georgia: 'Accounting: new base localization (chart of accounts, taxes, VAT report) and ISO state codes.'
localizations/guatemala: 'Accounting: Factura Especial (FESP), FEL cancellation via Infile, E10 fuel tax, SAT VAT books. eCommerce and POS: FEL
  e-invoicing requirements.'
localizations/hong-kong: 'Accounting: HKFRS-compliant chart and statements. Payroll: many additions (MPF, IR56 forms, Autopay, rentals, leave
  rules, pay schedules, casual/non-employee structures, termination rules).'
localizations/hungary: 'Accounting: A60 EC sales list; received bills fetched from the NAV API.'
localizations/india: 'Accounting: price-adjustment credit notes, bill of entry for imports with landed costs, flexible TDS, GST composition scheme
  (CMP-08, GSTR-4), Schedule III financial statements.'
localizations/indonesia: 'Accounting: updated chart and asset models, simpler contact tax fields, PPN Dipungut tax. Payroll: default accounts,
  overtime rule. POS: QRIS kiosk payments.'
localizations/iraq: 'Payroll: new base payroll localization (salary structure, social insurance, leaves, end of service, overtime).'
localizations/italy: 'Accounting: notes (causale) and attachments (allegati) on e-invoices.'
localizations/japan: 'Accounting: statements and chart per Chusho Kaikei Yoryou and e-Tax codes; consumption tax section in the tax return.'
localizations/jordan: 'Accounting: better JoFotara error handling and credit-note sync, new invoice types, UX in the Send wizard. POS: JoFotara
  refunds and receipts.'
localizations/kazakhstan: 'Accounting: ISO 3166-2 state names and codes.'
localizations/korea: 'Accounting: improved VAT reports; ''Issuance Type'' on invoices routes data to report lines.'
localizations/kuwait: 'Accounting: ISO state codes. Payroll: new base localization.'
localizations/kyrgyzstan: 'Accounting: ISO 3166-2 state names and codes.'
localizations/lebanon: 'Accounting: ISO state codes, duplicates removed.'
localizations/lithuania: 'Payroll: inputs converted to the new salary input flow.'
localizations/luxembourg: 'Payroll: Decsal and Decmal reports.'
localizations/malaysia: 'Accounting: consolidated invoices, MyInvois across branches and for sole proprietors. POS: self-service MyInvois e-invoicing.'
localizations/mexico: 'Accounting: bimonthly global invoices, CFDI cancellation acknowledgment, services in foreign-trade invoices, updated rates,
  factoring payments, NIF B-6/B-3 statements, complementary trial balance XML, SAT download of missing bills, smarter XML reader. Inventory: driver
  on delivery order. Payroll: CFDI link in payslip email.'
localizations/oman: 'Accounting: ISO state codes. Payroll: new base localization including WPS salary files.'
localizations/pakistan: 'Accounting: reworked chart with parent accounts, streamlined taxes, dynamic statements, MRP tax, new partner ID fields,
  FBR e-invoicing. Payroll: year-end tax adjustment. POS: FBR real-time reporting.'
localizations/peru: 'Accounting: 19 SUNAT inventory-and-balances sub-books, GRE for internal transfers, electronic vendor withholding documents,
  fixed-amount ISC. POS: SUNAT thermal receipts.'
localizations/philippines: 'Accounting: BIR-compliant partner ledger and books of accounts, BIR 2306/2307 certificates, entity type, disbursement
  voucher, BIR1600VT and 2551Q reports, senior/PWD discounts. Payroll: base package with BIR forms, loan deductions, annualization.'
localizations/qatar: 'Accounting: ISO 3166-2 state names and codes.'
localizations/romania: 'Accounting: CPV codes in eFactura, updated VAT, ANAF PDF retrieval, period sync, SAF-T with stock, D300 XML, resend rejected
  invoices.'
localizations/saudi-arabia: 'Accounting: reworked chart and asset models, many ZATCA improvements (Send wizard sync, batch, invoice/transaction
  types, exemption reasons, address rules, multi-ID). Payroll: many additions (GOSI, end of service, leave rules). POS: better down payments,
  on-demand ZATCA PDF.'
localizations/singapore: 'Accounting: refined GST taxes, IRAS-compliant invoice PDFs, SFRS-compliant chart and statements.'
localizations/sri-lanka: 'Accounting: new localization (chart, taxes, statements, VAT 001, WHT 001) and compliant tax invoice layout.'
localizations/taiwan: 'Accounting: updated chart, statements and tax reports; ECPay details on quotations. eCommerce and POS: ECPay e-invoicing.'
localizations/tajikistan: 'Accounting: ISO 3166-2 state names and codes.'
localizations/thailand: 'Accounting: TFRS-compliant chart, RD Prep CSV exports, 50 Tawi certificate, withholding summary report, separate tax
  invoices, updated debit/credit note PDFs.'
localizations/t-rkiye: 'Accounting: many e-invoicing improvements (scenarios, types, Nilvera — now Enterprise-only), parent accounts per GIB chart,
  multi-ID partner identifiers, stamp taxes, exchange rates. Inventory: e-Dispatch send/receive. Payroll: advanced structure, severance, 1003B,
  incentives.'
localizations/turkmenistan: 'Accounting: ISO 3166-2 state names and codes.'
localizations/united-arab-emirates: 'Accounting: redesigned IFRS chart with parent accounts, asset models, FTA audit file. Payroll: GPSSA/ADPF
  contributions, DEWS, Emiratization report, WPS, end of service, overtime, calendar-day schedules.'
localizations/united-kingdom: 'Accounting: HMRC authorisation per company; VAT returns for several companies without re-authenticating.'
localizations/united-states-of-america: 'Accounting: dedicated accounts per asset model, ''Avalara Included'' AvaTax option, redesigned sales
  tax report. Payroll: NYC/Yonkers taxes, overtime deduction, new states, payment-date-based YTD. Time Off: better default leave types.'
localizations/uruguay: 'Accounting: DGI taxpayer lookup via Uruware; non-billable products on e-invoices.'
localizations/uzbekistan: 'Accounting: new base localization (chart, taxes, statements), so''m symbol, Russian reports, PINFL on B2C invoices.'
localizations/vietnam: 'Accounting: chart and balance sheet per Circular 99/2025, 01/GTGT declaration with Appendix 142 and XML export, internal
  transfer notes via SInvoice, parent accounts, new journals/ledgers. POS: SInvoice e-invoices.'
ai/iap-credits-required: All AI features consume IAP credits.
ai/agentic-automation: Agents can update their own configuration, run from automated/scheduled actions, and show automation chat logs; agents
  get avatars.
ai/ai-agents-ask-questions-about-a-file: Ask an agent questions about a file while previewing it.
ai/ai-agents-create-records: Ask an agent to create records, including from an uploaded instruction file.
ai/ai-agents-feedback: Agents show live progress instead of a generic 'thinking' message.
ai/ai-agents-filter-by-time-period: Agents can filter by periods (weeks, quarters…) when building views.
ai/ai-agents-image-generation: Agents generate images and buttons for websites and mailings.
ai/ai-agents-reprocess-sources: Ask agents to reprocess their sources.
ai/ai-agents-send-files: Upload files and link documents in agent chats.
ai/ai-agents-update-records: Ask an agent to update records.
ai/ai-chat-request-options: A '+' menu adds options to an AI request.
ai/automatic-ai-model-selection: Pick a provider; Odoo chooses the best model per task.
ai/connect-odoo-to-anything: Connect external tools to the database via MCP (Model Context Protocol).
ai/default-prompts: Default prompts with context and dynamic values.
ai/interactive-agent-responses: Answer agent questions and permission requests with buttons.
ai/preview-cards-in-live-chat: Agents in live chat can show clickable record cards.
ai/stored-conversations: Agent conversations are kept for 30 days.
ai/tool-call-limit-confirmation: Agents ask for confirmation when they hit the tool-call limit.
ai/topics-renamed-to-skills: '''Topics'' are renamed ''skills''.'
ai/voice-interaction: Dictate requests to an agent.
appointments/accessory-products-for-appointments: Sell accessory products during appointment checkout.
appointments/appointment-booking-flow: Choosing a user/resource and a time slot happens on one page.
appointments/appointment-names: Customer name, type and seats shown on bookings in Gantt and calendar.
appointments/appointment-page-design: Refreshed appointment pages on mobile and desktop.
appointments/appointment-rescheduling: Reschedule booked appointments in a few clicks.
appointments/appointments-calendar-view: Create bookings and assign resources from any schedule calendar view.
appointments/attendance-at-a-glance: Gantt view shows expected attendance per slot.
appointments/automatic-resource-assignment: Automatic resource assignment considers the number of participants.
appointments/availability-display: Accurate availability across appointment types, including private busy events.
appointments/booking-capacity-control: Limit how many bookings can start in the same slot.
appointments/booking-shortcuts: Kanban shortcuts to bookings to confirm, upcoming and today's.
appointments/closed-days-management: Easier management of closed days.
appointments/consistent-booking-page-design: Booking pages follow website styling even without the Website app.
appointments/customer-feedback: Ask customers for feedback after appointments.
appointments/default-party-size: Group bookings preselect two guests.
appointments/maximum-capacity-override: Override maximum capacity manually.
appointments/performance-improvements: Faster availability computation and booking.
appointments/web-page-redesign: More consistent booking pages with clearer information.
appointments/website-editor-blocks: Website editor blocks can be placed anywhere on appointment pages.
appraisals/external-360-feedbacks: Send 360° feedback requests to any contact.
appraisals/next-appraisal-date: Managers can edit the next appraisal date without extra rights.
appraisals/parent-goal-progression: Parent goals show progress from their sub-goals.
appraisals/smart-template-selection: New appraisals pick the department's template by default.
attendances/automatic-check-out-time: Employees without fixed hours can set an automatic check-out time.
attendances/overtime-analysis-report: New overtime analysis report showing which rule applied.
attendances/overtime-rulesets: Smart button to link new employees to an overtime ruleset.
attendances/photo-at-check-in: Take a photo at check-in when the device has a camera.
attendances/prevent-app-use: Users without Attendances rights can no longer use the app.
attendances/public-holiday-option-ruleset: Overtime rates for public holidays in rulesets.
barcode/backorders: Choose whether to create a backorder from Barcode.
barcode/barcode-product-creation: Scan an unknown barcode to create the product via Barcode Lookup.
barcode/batch-receipts: Receipts from the same vendor are suggested as a batch.
barcode/bulk-lot-serial-number-generation: Generate lots/serial numbers in bulk.
barcode/fixed-button-positions: Buttons keep a fixed position to avoid mistakes.
barcode/inventory-count: Enter the total counted quantity manually during inventory counts.
barcode/light-users: Light users can be limited to the Barcode app.
barcode/manual-entry: Enter lot numbers and quantities manually when scanning is impossible.
barcode/manufacturing-operations: 'Manufacturing in Barcode: irrelevant settings removed, reserved lots only shown when enabled, mandatory scans
  no longer block by-product edits.'
barcode/mobile-user-login-button: Login button in the mobile view.
barcode/packages-pre-encoded-contents: Pre-encode package contents announced by the vendor; scanning the package receives it with its contents.
barcode/packages-untracked-goods: Untracked goods registered earlier stay in the package contents when scanned later.
blog/blog-module-redesign: More styles and options for blog posts, blog home and category pages.
blog/recommended-post: Show a 'Recommended Post' at the end of a blog post.
blog/scheduled-blog-posts: Followers get an email when a scheduled post goes live.
calendar/browse-other-calendars: Show colleagues' calendars from the sidebar.
calendar/detection-of-times-in-all-day-event-titles: Events created in the 'All day' row pick up a time written in the title (e.g. '2 PM Meeting').
calendar/google-and-outlook-synchronization: Much faster and more reliable Google/Outlook calendar sync.
calendar/google-calendar-sync: Work locations set in Google Calendar are reflected in Odoo.
calendar/linked-records: Link a calendar event to any Odoo record.
calendar/manage-and-share-availabilities: Manage and share a link to your availabilities or appointments from Calendar.
calendar/manage-pending-activities: See and handle pending activities in the calendar.
calendar/mobile-calendar-redesign: Easier calendar navigation on mobile.
calendar/multiple-calendars-in-one-place: Several calendars per user, including shared team calendars.
calendar/non-recurring-appointments: Easier one-off (non-recurring) appointment openings from Appointments and Calendar.
calendar/sync-multiple-google-calendars: Sync several Google calendars, both ways.
contacts/contact-enrichment: Enrich one or many contacts with company data.
contacts/hierarchical-view: New hierarchy view for contacts.
crm/hidden-address-info: Address fields are hidden to push creating a proper contact.
crm/lead-distribution: 'Per-salesperson lead assignment mode: always in rotation, in rotation with a limit, or out of rotation.'
crm/lead-generation: Lead generation offers more sources and now uses Dun & Bradstreet data instead of Clearbit.
crm/pipeline-switcher: Dropdown to switch between sales teams' pipelines.
